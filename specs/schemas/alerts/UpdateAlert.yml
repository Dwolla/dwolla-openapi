UpdateAlert:
  title: UpdateAlert
  description: Parameters to update an alert. Currently, the only supported update is resolving the alert.
  type: object
  required:
    - status
  properties:
    status:
      type: string
      description: The alert's new status. Must be `resolved`.
      const: resolved
      example: resolved
UpdateAlertStatusInvalidError:
  title: UpdateAlertStatusInvalidError
  description: The request body's `status` is missing or isn't `resolved`.
  type: object
  example:
    code: ValidationError
    message: Validation error(s) present. See embedded errors list for more details.
    _embedded:
      errors:
        - code: Invalid
          message: Status invalid.
          path: /status
          _links: {}
  required:
    - code
    - message
    - _embedded
  properties:
    code:
      type: string
      enum:
        - ValidationError
      example: ValidationError
    message:
      type: string
      example: Validation error(s) present. See embedded errors list for more details.
    _embedded:
      type: object
      required:
        - errors
      properties:
        errors:
          type: array
          minItems: 1
          items:
            type: object
            required:
              - code
              - message
              - path
            properties:
              code:
                type: string
                enum:
                  - Invalid
                example: Invalid
              message:
                type: string
                example: Status invalid.
              path:
                type: string
                example: /status
              _links:
                type: object
                example: {}
UpdateAlertStatusNotAllowedError:
  title: UpdateAlertStatusNotAllowedError
  description: The alert can't be resolved, such as when it's already resolved or doesn't have a `resolve` link.
  type: object
  example:
    code: ValidationError
    message: Validation error(s) present. See embedded errors list for more details.
    _embedded:
      errors:
        - code: NotAllowed
          message: Status not allowed.
          path: /status
          _links: {}
  required:
    - code
    - message
    - _embedded
  properties:
    code:
      type: string
      enum:
        - ValidationError
      example: ValidationError
    message:
      type: string
      example: Validation error(s) present. See embedded errors list for more details.
    _embedded:
      type: object
      required:
        - errors
      properties:
        errors:
          type: array
          minItems: 1
          items:
            type: object
            required:
              - code
              - message
              - path
            properties:
              code:
                type: string
                enum:
                  - NotAllowed
                example: NotAllowed
              message:
                type: string
                example: Status not allowed.
              path:
                type: string
                example: /status
              _links:
                type: object
                example: {}
