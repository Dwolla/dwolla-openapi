SandboxSimulationVirtualTransferItem:
  title: SandboxSimulationVirtualTransferItem
  description: One simulated external (VAN) transfer in a sandbox-simulations request.
  type: object
  required:
    - _link
    - amount
  properties:
    _link:
      type: object
      description: Link wrapper for the destination funding source (Dwolla HAL-style single link).
      required:
        - destination
      properties:
        destination:
          type: object
          required:
            - href
          properties:
            href:
              type: string
              format: uri
              example: https://api-sandbox.dwolla.com/funding-sources/5880e310-675a-4ce3-87d9-a475cc565e09
    amount:
      $ref: '../common.yml#/components/schemas/TransferAmount'

SandboxSimulationVirtualRequest:
  title: SandboxSimulationVirtualRequest
  description: |
    Simulate Virtual Account Number (VAN) / external transfers in Sandbox. Up to 10 transfers per request;
    transfers are created and processed immediately. Successful response is 202 Accepted.
  type: object
  required:
    - type
    - transfers
  properties:
    type:
      type: string
      const: virtual
      description: Must be set to virtual for VAN transfer simulation.
    transfers:
      type: array
      description: Transfers to simulate (max 10 per request).
      minItems: 1
      maxItems: 10
      items:
        $ref: './SandboxSimulations.yml#/SandboxSimulationVirtualTransferItem'

SandboxSimulationBankProcessingRequest:
  title: SandboxSimulationBankProcessingRequest
  description: |
    Omit the body, send JSON null, or an empty JSON object. Triggers processing (or failure) for the last
    500 bank transfers on the authorized application or Sandbox account, and initiated micro-deposits.
    Successful response is 200 with a HAL body including total.
  oneOf:
    - title: SandboxSimulationBankProcessingEmptyObject
      description: Empty JSON object.
      type: object
      additionalProperties: false
    - type: 'null'
      description: JSON null body (uncommon).

SandboxSimulationRequest:
  title: SandboxSimulationRequest
  description: |
    Bank transfer processing (empty body) or VAN transfer simulation (type virtual + transfers).
    Use an empty object or omit the body for bank processing; use a virtual payload for VAN simulation.
  oneOf:
    - $ref: './SandboxSimulations.yml#/SandboxSimulationBankProcessingRequest'
    - $ref: './SandboxSimulations.yml#/SandboxSimulationVirtualRequest'

SandboxSimulationBankProcessingResponse:
  title: SandboxSimulationBankProcessingResponse
  description: Response when simulating bank transfer processing (200 OK).
  type: object
  required:
    - _links
    - total
  properties:
    total:
      type: integer
      format: int32
      example: 8
      description: Count of bank transfers (and related items) affected by the simulation run.
    _links:
      type: object
      required:
        - self
      properties:
        self:
          $ref: '../common.yml#/components/schemas/HalLink'
