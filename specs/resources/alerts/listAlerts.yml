    - lang: javascript
      source: |
        // Using dwolla-v2 - https://github.com/Dwolla/dwolla-v2-node
        dwolla
          .get("alerts")
          .then((res) => res.body._embedded["alerts"][0].status); // => 'open'
    - lang: python
      source: |
        # Using dwollav2 - https://github.com/Dwolla/dwolla-v2-python
        alerts = app_token.get('alerts')
        alerts.body['_embedded']['alerts'][0]['status'] # => 'open'
