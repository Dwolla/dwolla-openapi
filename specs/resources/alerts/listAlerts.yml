    '400':
      description: Bad Request
      headers: {}
      content:
        application/vnd.dwolla.v1.hal+json:
          schema:
            oneOf:
              - $ref: '../../schemas/alerts/Alerts.yml#/ListAlertsInvalidQueryParameterError'
              - $ref: '../../schemas/alerts/Alerts.yml#/ListAlertsValidationError'
          examples:
            invalid_cursor:
              summary: Modified or malformed cursor
              value:
                code: InvalidQueryParameter
                message: Invalid cursor.
            limit_out_of_range:
              summary: limit is less than 1 or greater than 200
              value:
                code: InvalidQueryParameter
                message: Limit must be > 0 and <= 200.
            limit_not_an_integer:
              summary: limit isn't an integer
              value:
                code: InvalidQueryParameter
                message: 'Invalid query parameter: limit'
            invalid_status:
              summary: Invalid or empty status
              value:
                code: ValidationError
                message: Validation error(s) present. See embedded errors list for more details.
                _embedded:
                  errors:
                    - code: Invalid
                      message: 'Status must be one of: open, resolved.'
                      path: /status
                      _links: {}
            repeated_status:
              summary: More than one status
              value:
                code: ValidationError
                message: Validation error(s) present. See embedded errors list for more details.
                _embedded:
                  errors:
                    - code: Invalid
                      message: Only one status may be specified.
                      path: /status
                      _links: {}
            status_does_not_match_cursor:
              summary: Status changed or dropped while paging
              value:
                code: ValidationError
                message: Validation error(s) present. See embedded errors list for more details.
                _embedded:
                  errors:
                    - code: Invalid
                      message: Status does not match the cursor. Follow the next or prev link as returned, or omit the cursor to start a new list.
