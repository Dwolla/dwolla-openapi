  parameters:
    - name: limit
      in: query
      description: Maximum number of results to return
      required: false
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 200
        default: 25
        example: 25
    - name: status
      in: query
      description: |
        Filter by alert status. Case-insensitive. Specify at most once. Omit to list every alert. The `next` and `prev` links keep this filter.
      required: false
      schema:
        type: string
        enum:
          - open
          - resolved
        example: open
    - $ref: '../../schemas/common.yml#/components/parameters/Accept'
