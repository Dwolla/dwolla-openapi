get:
  tags:
    - alerts
  summary: Retrieve alert
  description: |
    Returns a single alert for your Dwolla account. Alerts notify you of activity that may need your attention, such as unusual transfer activity for one of your Customers. When an alert needs a response from you, it includes an `actionRequired` object whose `description` explains what to do.

    Alerts are in active development and must be enabled for your account. To enable alerts, please [reach out to Dwolla](https://www.dwolla.com/contact?b=apidocs).

    If you can resolve the alert, its `_links` include a `resolve` link. To resolve it, send `{"status": "resolved"}` to `POST /alerts/{id}`.

    Requires an application access token for your account. Returns a `404 NotFound` error if the alert doesn't exist.
  operationId: getAlert
  x-speakeasy-name-override: get
  x-codeSamples:
    - lang: bash
      source: |
        GET https://api-sandbox.dwolla.com/alerts/d4bd3a1e-7c6e-4e8a-9a5c-3b2f9d7e1a42
        Accept: application/vnd.dwolla.v1.hal+json
        Authorization: Bearer pBA9fVDBEyYZCEsLf/wKehyh1RTpzjUj5KzIRfDi0wKTii7DqY

        ...

        {
          "_links": {
            "self": {
              "href": "https://api-sandbox.dwolla.com/alerts/d4bd3a1e-7c6e-4e8a-9a5c-3b2f9d7e1a42",
              "type": "application/vnd.dwolla.v1.hal+json",
              "resource-type": "alert"
            },
            "customer": {
              "href": "https://api-sandbox.dwolla.com/customers/b0e1c5a6-2f3d-4e7a-8c9b-1d2e3f4a5b6c",
              "type": "application/vnd.dwolla.v1.hal+json",
              "resource-type": "customer"
            },
            "transfers": {
              "href": "https://api-sandbox.dwolla.com/customers/b0e1c5a6-2f3d-4e7a-8c9b-1d2e3f4a5b6c/transfers",
              "type": "application/vnd.dwolla.v1.hal+json",
              "resource-type": "transfer"
            },
            "resolve": {
              "href": "https://api-sandbox.dwolla.com/alerts/d4bd3a1e-7c6e-4e8a-9a5c-3b2f9d7e1a42",
              "type": "application/vnd.dwolla.v1.hal+json",
              "resource-type": "alert"
            }
          },
          "id": "d4bd3a1e-7c6e-4e8a-9a5c-3b2f9d7e1a42",
          "type": "unusual-transfer-activity",
          "status": "open",
          "description": "Unusual transfer activity was detected for one of your customers.",
          "actionRequired": {
            "description": "Your feedback is required to complete this customer's review. Please review the activity and email risk@dwolla.com to confirm the appropriate action.\n\nApprove Transfers: Activity is expected.\nSuspend Customer: Activity is not expected.\n\nPlease include the customer ID and provide an explanation for the proposed action. We will reach out if we require more information."
          },
          "created": "2026-10-14T16:32:08.000Z",
          "lastUpdated": "2026-10-14T16:32:08.000Z",
          "unusualTransferActivity": {
            "transferCount": 12,
            "totalAmount": {
              "value": "48250.00",
              "currency": "USD"
            }
          }
        }
    - lang: javascript
      source: |
        // Using dwolla-v2 - https://github.com/Dwolla/dwolla-v2-node
        var alertUrl =
          "https://api-sandbox.dwolla.com/alerts/d4bd3a1e-7c6e-4e8a-9a5c-3b2f9d7e1a42";

        dwolla.get(alertUrl).then((res) => res.body.status); // => 'open'
    - lang: python
      source: |
        # Using dwollav2 - https://github.com/Dwolla/dwolla-v2-python
        alert_url = 'https://api-sandbox.dwolla.com/alerts/d4bd3a1e-7c6e-4e8a-9a5c-3b2f9d7e1a42'

        alert = app_token.get(alert_url)
        alert.body['status'] # => 'open'
    - lang: php
      source: |
        /**
         * No example for this language yet.
         **/
    - lang: ruby
      source: |
        # Using dwolla_v2 - https://github.com/Dwolla/dwolla-v2-ruby
        alert_url = 'https://api-sandbox.dwolla.com/alerts/d4bd3a1e-7c6e-4e8a-9a5c-3b2f9d7e1a42'

        alert = app_token.get alert_url
        alert.status # => "open"
  parameters:
    - name: id
      in: path
      description: The alert's unique identifier.
      required: true
      schema:
        type: string
        format: uuid
        example: d4bd3a1e-7c6e-4e8a-9a5c-3b2f9d7e1a42
    - $ref: '../../schemas/common.yml#/components/parameters/Accept'
  responses:
    '200':
      description: successful operation
      headers: {}
      content:
        application/vnd.dwolla.v1.hal+json:
          schema:
            $ref: '../../schemas/alerts/Alert.yml#/Alert'
          examples:
            open_unusual_transfer_activity:
              summary: Open unusual transfer activity alert
              value:
                _links:
                  self:
                    href: https://api-sandbox.dwolla.com/alerts/d4bd3a1e-7c6e-4e8a-9a5c-3b2f9d7e1a42
                    type: application/vnd.dwolla.v1.hal+json
                    resource-type: alert
                  customer:
                    href: https://api-sandbox.dwolla.com/customers/b0e1c5a6-2f3d-4e7a-8c9b-1d2e3f4a5b6c
                    type: application/vnd.dwolla.v1.hal+json
                    resource-type: customer
                  transfers:
                    href: https://api-sandbox.dwolla.com/customers/b0e1c5a6-2f3d-4e7a-8c9b-1d2e3f4a5b6c/transfers
                    type: application/vnd.dwolla.v1.hal+json
                    resource-type: transfer
                  resolve:
                    href: https://api-sandbox.dwolla.com/alerts/d4bd3a1e-7c6e-4e8a-9a5c-3b2f9d7e1a42
                    type: application/vnd.dwolla.v1.hal+json
                    resource-type: alert
                id: d4bd3a1e-7c6e-4e8a-9a5c-3b2f9d7e1a42
                type: unusual-transfer-activity
                status: open
                description: Unusual transfer activity was detected for one of your customers.
                actionRequired:
                  description: |-
                    Your feedback is required to complete this customer's review. Please review the activity and email risk@dwolla.com to confirm the appropriate action.

                    Approve Transfers: Activity is expected.
                    Suspend Customer: Activity is not expected.

                    Please include the customer ID and provide an explanation for the proposed action. We will reach out if we require more information.
                created: '2026-10-14T16:32:08.000Z'
                lastUpdated: '2026-10-14T16:32:08.000Z'
                unusualTransferActivity:
                  transferCount: 12
                  totalAmount:
                    value: '48250.00'
                    currency: USD
    '401':
      description: Unauthorized
      headers: {}
      content:
        application/vnd.dwolla.v1.hal+json:
          schema:
            type: object
            properties:
              code:
                type: string
                example: InvalidScope
              message:
                type: string
                example: Missing or invalid scopes for requested endpoint.
    '403':
      description: Forbidden
      headers: {}
      content:
        application/vnd.dwolla.v1.hal+json:
          schema:
            type: object
            properties:
              code:
                type: string
                example: InvalidTokenType
              message:
                type: string
                example: The requested endpoint requires an account token.
    '404':
      description: Not Found
      headers: {}
      content:
        application/vnd.dwolla.v1.hal+json:
          schema:
            $ref: '../../schemas/common.yml#/components/schemas/NotFoundError'
post:
  tags:
    - alerts
  summary: Update alert
  description: |
    Resolves an alert for your Dwolla account by setting its `status` to `resolved`. Returns the updated alert, with `status` set to `resolved`, the `resolved` timestamp set, and no `resolve` link.

    You can only resolve an alert that has a `resolve` link in its `_links`. The link is present only while the alert is `open` and can be resolved, so check for it before resolving an alert.

    Resolving an alert changes only the alert's status. It doesn't release holds on transfers or change the Customer. If the alert includes `actionRequired`, follow its instructions separately.

    Resolving an alert that's already resolved, or that you can't resolve, returns a `400 ValidationError` error with the embedded code `NotAllowed`, and the alert isn't changed.

    Alerts are in active development and must be enabled for your account. To enable alerts, please [reach out to Dwolla](https://www.dwolla.com/contact?b=apidocs).

    Requires an application access token for your account. Returns a `404 NotFound` error if the alert doesn't exist.
  operationId: updateAlert
  x-speakeasy-name-override: update
  x-codeSamples:
    - lang: bash
      source: |
        POST https://api-sandbox.dwolla.com/alerts/d4bd3a1e-7c6e-4e8a-9a5c-3b2f9d7e1a42
        Content-Type: application/vnd.dwolla.v1.hal+json
        Accept: application/vnd.dwolla.v1.hal+json
        Authorization: Bearer pBA9fVDBEyYZCEsLf/wKehyh1RTpzjUj5KzIRfDi0wKTii7DqY

        {
          "status": "resolved"
        }

        ...

        {
          "_links": {
            "self": {
              "href": "https://api-sandbox.dwolla.com/alerts/d4bd3a1e-7c6e-4e8a-9a5c-3b2f9d7e1a42",
              "type": "application/vnd.dwolla.v1.hal+json",
              "resource-type": "alert"
            },
            "customer": {
              "href": "https://api-sandbox.dwolla.com/customers/b0e1c5a6-2f3d-4e7a-8c9b-1d2e3f4a5b6c",
              "type": "application/vnd.dwolla.v1.hal+json",
              "resource-type": "customer"
            },
            "transfers": {
              "href": "https://api-sandbox.dwolla.com/customers/b0e1c5a6-2f3d-4e7a-8c9b-1d2e3f4a5b6c/transfers",
              "type": "application/vnd.dwolla.v1.hal+json",
              "resource-type": "transfer"
            }
          },
          "id": "d4bd3a1e-7c6e-4e8a-9a5c-3b2f9d7e1a42",
          "type": "unusual-transfer-activity",
          "status": "resolved",
          "description": "Unusual transfer activity was detected for one of your customers.",
          "created": "2026-10-14T16:32:08.000Z",
          "lastUpdated": "2026-10-16T09:12:44.000Z",
          "resolved": "2026-10-16T09:12:44.000Z",
          "unusualTransferActivity": {
            "transferCount": 12,
            "totalAmount": {
              "value": "48250.00",
              "currency": "USD"
            }
          }
        }
    - lang: javascript
      source: |
        // Using dwolla-v2 - https://github.com/Dwolla/dwolla-v2-node
        var alertUrl =
          "https://api-sandbox.dwolla.com/alerts/d4bd3a1e-7c6e-4e8a-9a5c-3b2f9d7e1a42";
        var requestBody = {
          status: "resolved",
        };

        dwolla.post(alertUrl, requestBody).then((res) => res.body.status); // => 'resolved'
    - lang: python
      source: |
        # Using dwollav2 - https://github.com/Dwolla/dwolla-v2-python
        alert_url = 'https://api-sandbox.dwolla.com/alerts/d4bd3a1e-7c6e-4e8a-9a5c-3b2f9d7e1a42'
        request_body = {
          'status': 'resolved'
        }

        alert = app_token.post(alert_url, request_body)
        alert.body['status'] # => 'resolved'
    - lang: php
      source: |
        /**
         * No example for this language yet.
         **/
    - lang: ruby
      source: |
        # Using dwolla_v2 - https://github.com/Dwolla/dwolla-v2-ruby
        alert_url = 'https://api-sandbox.dwolla.com/alerts/d4bd3a1e-7c6e-4e8a-9a5c-3b2f9d7e1a42'
        request_body = {
          "status" => "resolved"
        }

        alert = app_token.post alert_url, request_body
        alert.status # => "resolved"
  parameters:
    - name: id
      in: path
      description: The alert's unique identifier.
      required: true
      schema:
        type: string
        format: uuid
        example: d4bd3a1e-7c6e-4e8a-9a5c-3b2f9d7e1a42
    - $ref: '../../schemas/common.yml#/components/parameters/Accept'
  requestBody:
    required: true
    description: Parameters to resolve an alert
    content:
      application/json:
        schema:
          $ref: '../../schemas/alerts/UpdateAlert.yml#/UpdateAlert'
        examples:
          resolve:
            summary: Resolve an alert
            value:
              status: resolved
  responses:
    '200':
      description: successful operation
      headers: {}
      content:
        application/vnd.dwolla.v1.hal+json:
          schema:
            $ref: '../../schemas/alerts/Alert.yml#/Alert'
          examples:
            resolved_unusual_transfer_activity:
              summary: Resolved unusual transfer activity alert
              value:
                _links:
                  self:
                    href: https://api-sandbox.dwolla.com/alerts/d4bd3a1e-7c6e-4e8a-9a5c-3b2f9d7e1a42
                    type: application/vnd.dwolla.v1.hal+json
                    resource-type: alert
                  customer:
                    href: https://api-sandbox.dwolla.com/customers/b0e1c5a6-2f3d-4e7a-8c9b-1d2e3f4a5b6c
                    type: application/vnd.dwolla.v1.hal+json
                    resource-type: customer
                  transfers:
                    href: https://api-sandbox.dwolla.com/customers/b0e1c5a6-2f3d-4e7a-8c9b-1d2e3f4a5b6c/transfers
                    type: application/vnd.dwolla.v1.hal+json
                    resource-type: transfer
                id: d4bd3a1e-7c6e-4e8a-9a5c-3b2f9d7e1a42
                type: unusual-transfer-activity
                status: resolved
                description: Unusual transfer activity was detected for one of your customers.
                created: '2026-10-14T16:32:08.000Z'
                lastUpdated: '2026-10-16T09:12:44.000Z'
                resolved: '2026-10-16T09:12:44.000Z'
                unusualTransferActivity:
                  transferCount: 12
                  totalAmount:
                    value: '48250.00'
                    currency: USD
    '400':
      description: Bad Request
      headers: {}
      content:
        application/vnd.dwolla.v1.hal+json:
          schema:
            oneOf:
              - $ref: '../../schemas/alerts/UpdateAlert.yml#/UpdateAlertStatusInvalidError'
              - $ref: '../../schemas/alerts/UpdateAlert.yml#/UpdateAlertStatusNotAllowedError'
          examples:
            status_invalid:
              summary: status is missing or isn't resolved
              value:
                code: ValidationError
                message: Validation error(s) present. See embedded errors list for more details.
                _embedded:
                  errors:
                    - code: Invalid
                      message: Status invalid.
                      path: /status
                      _links: {}
            status_not_allowed:
              summary: Alert is already resolved or can't be resolved
              value:
                code: ValidationError
                message: Validation error(s) present. See embedded errors list for more details.
                _embedded:
                  errors:
                    - code: NotAllowed
                      message: Status not allowed.
                      path: /status
                      _links: {}
    '401':
      description: Unauthorized
      headers: {}
      content:
        application/vnd.dwolla.v1.hal+json:
          schema:
            type: object
            properties:
              code:
                type: string
                example: InvalidScope
              message:
                type: string
                example: Missing or invalid scopes for requested endpoint.
    '403':
      description: Forbidden
      headers: {}
      content:
        application/vnd.dwolla.v1.hal+json:
          schema:
            type: object
            properties:
              code:
                type: string
                example: InvalidTokenType
              message:
                type: string
                example: The requested endpoint requires an account token.
    '404':
      description: Not Found
      headers: {}
      content:
        application/vnd.dwolla.v1.hal+json:
          schema:
            $ref: '../../schemas/common.yml#/components/schemas/NotFoundError'
